name: CI and Render deployment

# Validate pull requests targeting main and every commit merged into main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  # The workflow only needs to read the repository contents.
  contents: read

# Keep runs for the same ref ordered; do not cancel a run that may be deploying.
concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Run backend tests and frontend quality/build checks before any deployment.
  checks:
    name: Tests and frontend checks
    runs-on: ubuntu-latest
    env:
      # CI-only Django settings; these are placeholders, not production credentials.
      SECRET_KEY: ci-only-not-a-production-secret
      DEBUG: "False"
      CLOUD_NAME: ci-placeholder
      API_KEY: ci-placeholder
      API_SECRET: ci-placeholder
      SENTRY_DSN: ""
    steps:
      - name: Checkout
        # Download the repository source code onto the GitHub runner.
        uses: actions/checkout@v5.1.0

      - name: Set up Python
        # Use the same Python version as the backend runtime and cache pip packages.
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        # Install Django and the backend packages listed in requirements.txt.
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run all Django tests and collect coverage
        # Run Django's test discovery and produce an XML coverage report for SonarCloud.
        working-directory: backend
        run: |
          coverage run --source=vehicle_api,user_api,application_api manage.py test
          coverage xml -o coverage.xml

      - name: Set up Node.js
        # Prepare Node.js and cache npm packages using the frontend lockfile.
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        # Install the exact frontend dependency versions recorded in package-lock.json.
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        # Fail the job if ESLint finds frontend code issues.
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        # Confirm that Vite can compile the production frontend bundle.
        working-directory: frontend
        run: npm run build

      - name: Upload backend coverage report
        # Make the coverage report available to the separate SonarCloud job.
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error

  # Analyze code only after all tests and frontend checks have passed.
  sonarcloud:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    needs: checks
    env:
      # Add SONAR_TOKEN as a GitHub Actions repository secret.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        # SonarCloud needs full Git history to identify branches and changes.
        uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0

      - name: Download backend coverage report
        # Restore the XML report created by the checks job.
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend

      - name: Analyze with SonarCloud
        # Skip the scan until a SonarCloud token has been configured in GitHub.
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.4.1
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  # Trigger Render only for main pushes and only after the checks job succeeds.
  deploy:
    name: Deploy services to Render
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger backend and frontend deploys
        env:
          # Store both Render deploy hook URLs as GitHub Actions repository secrets.
          RENDER_BACKEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
          RENDER_FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          # Fail clearly if either Render deploy hook has not been configured.
          if [ -z "$RENDER_BACKEND_DEPLOY_HOOK_URL" ] || [ -z "$RENDER_FRONTEND_DEPLOY_HOOK_URL" ]; then
            echo "Configure both RENDER_BACKEND_DEPLOY_HOOK_URL and RENDER_FRONTEND_DEPLOY_HOOK_URL in GitHub Actions secrets."
            exit 1
          fi
          # Ask Render to start each service deployment.
          curl --fail-with-body --silent --show-error --request POST "$RENDER_BACKEND_DEPLOY_HOOK_URL"
          curl --fail-with-body --silent --show-error --request POST "$RENDER_FRONTEND_DEPLOY_HOOK_URL"
