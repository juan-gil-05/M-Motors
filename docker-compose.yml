services:
  # 1. Database service (PostgreSQL)
  db:
    image: postgres:16-alpine
    container_name: m-motors_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"

  # 2. Backend service (Django)
  backend:
    build: ./backend
    container_name: m-motors_backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG}
      - DATABASE_URL=${DATABASE_URL}
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    env_file:
      - ./.env

  # 3. Frontend services
  # Dev mode
  frontend-dev:
    build:
      context: ./frontend
      target: dev
    container_name: m-motors_frontend_dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

  # Prod mode
  frontend-prod:
    build:
      context: ./frontend
      target: production
    container_name: m-motors_frontend_prod
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: