# Directories containing application source code to analyze.
sonar.sources=backend/vehicle_api,backend/user_api,backend/application_api,backend/core,frontend/src

# Directories containing Django tests and the pattern used to identify test files.
sonar.tests=backend/vehicle_api/tests,backend/user_api/tests,backend/application_api/tests,backend/core/tests
sonar.test.inclusions=backend/**/tests/**/*.py,backend/**/test_*.py

# Ignore generated files and Django migration history during source analysis.
sonar.exclusions=**/tests/**,**/test_*.py,**/migrations/**,**/node_modules/**,**/dist/**,**/coverage/**

# Tell SonarCloud where coverage.py writes its XML report and which Python version is used.
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.version=3.11

# Import the coverage report produced by the frontend Vitest suite.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
