# Directories containing application source code to analyze.
sonar.sources=backend/vehicle_api,backend/user_api,backend/application_api,backend/core,frontend/src

# Directories containing backend and frontend test files.
sonar.tests=backend/vehicle_api/tests,backend/user_api/tests,backend/application_api/tests,backend/core/tests,frontend/src/test
sonar.test.inclusions=backend/**/tests/**/*.py,backend/**/test_*.py,frontend/src/test/**/*

# Exclude test files, generated files, and Django migration history from source analysis.
sonar.exclusions=**/tests/**,**/test/**,**/test_*.py,**/migrations/**,**/node_modules/**,**/dist/**,**/coverage/**

# Tell SonarCloud where coverage.py writes its XML report and which Python version is used.
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.python.version=3.11

# Import the coverage report produced by the frontend Vitest suite.
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
